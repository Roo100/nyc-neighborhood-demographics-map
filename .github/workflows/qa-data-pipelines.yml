name: Geographic and ACS pipeline QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/qa-data-pipelines.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-data-pipelines.yml'
      - 'scripts/build_income_nta.py'
      - 'scripts/fetch_acs_income.py'
      - 'tests/test_build_income_nta.py'
      - 'tests/nta.test.mjs'
      - 'tests/geography.test.mjs'
      - 'assets/js/nta.js'
      - 'assets/js/app.js'
      - 'assets/css/styles.css'
      - 'index.html'
      - 'tests/public_map.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python ETL scripts
        run: python -m compileall -q scripts
      - name: Test income aggregation and missing-data rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test pinned geography and geographic filtering
        run: REQUIRE_PINNED_GEOJSON=1 node --test tests/*.test.mjs
