name: Pin official 2020 NTA geography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pin-nta-geography.yml'

permissions:
  contents: write

concurrency:
  group: official-nta-snapshot
  cancel-in-progress: false

jobs:
  fetch-validate-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from NYC Department of City Planning Open Data
        run: python scripts/fetch_geography.py
      - name: Validate 262 identifiers, boroughs, coordinate ranges, geometry
        run: python scripts/validate_geography.py data/nta2020.geojson > data/nta2020-validation.json
      - name: Display validation summary
        run: cat data/nta2020-validation.json
      - name: Commit versioned validated snapshot only on change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nta2020.geojson data/nta2020-validation.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit."
          else
            git commit -m "data: pin verified NYC DCP 2020 NTA geographic snapshot [skip ci]"
            git push origin HEAD:main
          fi
