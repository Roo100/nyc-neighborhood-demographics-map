name: Browser acceptance — NYC POP
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'tests/browser-acceptance.mjs'
      - '.github/workflows/browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve checked-in atlas and run desktop/mobile acceptance
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-server.log 2>&1 &
          sleep 2
          node tests/browser-acceptance.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-pop-browser-review
          path: test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
